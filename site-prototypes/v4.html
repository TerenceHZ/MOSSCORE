<style>

body{background:#030505;color:var(--ink);font-family:var(--cjk);height:100vh;overflow:hidden}

@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.grain{position:fixed;inset:0;z-index:62;pointer-events:none;opacity:.3;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.55'/></svg>")}

.bars{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.03) 0 1px,transparent 1px 4px)}
.stage{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;justify-content:center;padding-left:9vw}

  animation:flip 1.1s cubic-bezier(.19,1,.22,1) forwards}

h1 .w:nth-child(2){animation-delay:.45s}
h1 .gold{color:transparent;background:linear-gradient(180deg,#fff3d0,#e8a020 55%,#8a5a10);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 40px rgba(232,160,32,.45))}
@keyframes flip{to{opacity:1;transform:none}}
@keyframes up{to{opacity:1}}
.sub{margin-top:28px;font:400 13px/2 var(--cjk);letter-spacing:.26em;color:#bfae8c;opacity:0;animation:up 1s 1s forwards}
.sub b{color:var(--gold2)}
.meta{margin-top:34px;display:flex;gap:28px;opacity:0;animation:up 1s 1.2s forwards}
.meta div{font:500 9.5px/1.7 var(--mono);letter-spacing:.24em;color:#5e5342}
.meta b{display:block;font-size:19px;letter-spacing:.04em;color:var(--gold)}
.cta{margin-top:40px;display:flex;gap:14px;opacity:0;animation:up 1s 1.35s forwards}
.btn{padding:16px 32px;border:1px solid rgba(232,160,32,.6);background:linear-gradient(180deg,rgba(232,160,32,.18),rgba(232,160,32,.04));
  font:600 11px/1 var(--mono);letter-spacing:.26em;color:#ffe0a6;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.btn:hover{box-shadow:0 0 46px rgba(232,160,32,.4);transform:translateY(-2px)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,240,200,.45) 50%,transparent 70%);
  transform:translateX(-120%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
.btn.g{border-color:rgba(99,192,142,.55);color:#b6f2d5;background:linear-gradient(180deg,rgba(99,192,142,.18),rgba(99,192,142,.04))}
.btn.g:hover{box-shadow:0 0 46px rgba(99,192,142,.35)}
.hud{position:fixed;z-index:20;font:500 9.5px/1.9 var(--mono);letter-spacing:.24em;color:#584e3e}
.hud.tl{left:3vw;top:3vh;color:var(--ink);letter-spacing:.3em}
.hud.tl b{color:var(--gold)}
.hud.bl{left:3vw;bottom:3vh}
.hud.br{right:3vw;bottom:3vh;text-align:right}
.hud.tr{right:3vw;top:3vh;color:var(--gold)}
</style><style id="noanimcss">

<script>
(function(){
  const cv=document.getElementById('tunnel'),ctx=cv.getContext('2d');
  let W,H,DPR,pts=[],t=0,mx=0,my=0,tx=0,ty=0;
  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
    cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
    pts=Array.from({length:520},()=>({z:Math.random(),a:Math.random()*Math.PI*2,
      s:Math.random()*0.8+0.2, gold:Math.random()<0.6}));
  }
  resize();addEventListener('resize',resize);
  addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5);ty=(e.clientY/innerHeight-.5);});
  function ring(z, col, lw){
    const cx=W/2 + mx*W*0.05, cy=H*0.56 + my*H*0.05;
    const r=W*0.06 + z*W*0.62;
    ctx.beginPath();
    ctx.ellipse(cx,cy,r,r*0.42,0,0,6.283);
    ctx.strokeStyle=col;ctx.lineWidth=lw*DPR;ctx.stroke();
  }
  function frame(){
    t+=0.004;
    mx+=(tx-mx)*.05;my+=(ty-my)*.05;
    ctx.fillStyle='rgba(3,5,5,.28)';ctx.fillRect(0,0,W,H);
    const cx=W/2 + mx*W*0.05, cy=H*0.56 + my*H*0.05;

    // 走廊环
    for(let i=12;i>=0;i--){
      const z=((i/12)+ (t%1))%1;
      const a=(1-z)*0.5;
      ring(z, `rgba(232,160,32,${(a*0.5).toFixed(3)})`, 1.2);
      ring(z+0.004, `rgba(99,192,142,${(a*0.25).toFixed(3)})`, 0.8);
    }
    // 放射线
    ctx.save();ctx.translate(cx,cy);
    for(let i=0;i<36;i++){
      const a=i/36*6.283 + t*0.4;
      const r1=W*0.06, r2=W*0.06+W*0.6;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1*0.42);
      ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2*0.42);
      ctx.strokeStyle=`rgba(232,160,32,${0.05+0.04*Math.sin(t*3+i)})`;
      ctx.lineWidth=DPR*0.6;ctx.stroke();
    }
    ctx.restore();

    // 飞行粒子
    for(const p of pts){
      p.z-=0.0026*p.s;
      if(p.z<=0.02){p.z=1;p.a=Math.random()*6.283;}
      const r=W*0.06+p.z*W*0.62;
      const x=cx+Math.cos(p.a+t)*r, y=cy+Math.sin(p.a+t)*r*0.42;
      const size=(1.6-p.z)*2.6*DPR;
      ctx.beginPath();ctx.arc(x,y,Math.max(size*0.3,0.4),0,6.283);
      ctx.fillStyle=p.gold?`rgba(255,214,150,${(1-p.z)*0.9})`:`rgba(150,235,200,${(1-p.z)*0.7})`;
      ctx.fill();
    }
    // 中心核
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,W*0.09);
    g.addColorStop(0,'rgba(255,240,205,.95)');g.addColorStop(.35,'rgba(232,160,32,.35)');g.addColorStop(1,'rgba(232,160,32,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,W*0.09,0,6.283);ctx.fill();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
(function(){const el=document.getElementById('clock');
  const p=n=>String(n).padStart(2,'0');
  setInterval(()=>{const d=new Date();el.textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} CST`;},1000);})();
</script>
