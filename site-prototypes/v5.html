<script>
(function(){
  const cv=document.getElementById('gl');
  const gl=cv.getContext('webgl',{antialias:false,alpha:false});
  if(!gl){document.body.style.background='#020303';return;}
  const vs=`
    attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  const fs=`
    precision highp float;
    uniform vec2 u_res; uniform float u_t; uniform vec2 u_m;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){
      vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
    }
    float fbm(vec2 p){
      float v=0., a=.5;
      for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=.5; }
      return v;
    }
    void main(){
      vec2 uv=(gl_FragCoord.xy - u_res*.5)/u_res.y;
      uv += u_m*0.06;
      float t=u_t*.06;
      vec2 q=vec2(fbm(uv*1.4+t), fbm(uv*1.4-t+5.2));
      float n=fbm(uv*2.1 + q*1.6 + vec2(t*0.8,-t*0.5));
      float n2=fbm(uv*4.0 - q*0.8 + t*1.6);
      float d=length(uv*vec2(1.0,1.25));
      float core=smoothstep(0.55,0.0,d);
      vec3 gold=vec3(0.91,0.63,0.13);
      vec3 green=vec3(0.39,0.75,0.56);
      vec3 col=vec3(0.008,0.014,0.012);
      col += gold * pow(n,2.2) * (0.55 + core*1.2);
      col += green * pow(n2,3.0) * 0.32;
      col += gold * core * 0.35;
      // 中心亮核 + 环晕
      col += vec3(1.0,0.9,0.72) * smoothstep(0.09,0.0,d) * 0.55;
      col += gold * smoothstep(0.42,0.34,d)*smoothstep(0.30,0.36,d) * 0.55;
      // 暗角
      col *= smoothstep(1.55,0.25,d);
      // 色散
      col.r *= 1.04; col.b *= 0.96;
      // 微噪点
      col += (hash(gl_FragCoord.xy+u_t)-0.5)*0.02;
      gl_FragColor=vec4(col,1.0);
    }`;
  function sh(type,src){
    const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;
  }
  const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uRes=gl.getUniformLocation(prog,'u_res');
  const uT=gl.getUniformLocation(prog,'u_t');
  const uM=gl.getUniformLocation(prog,'u_m');
  let mx=0,my=0,tmx=0,tmy=0,start=performance.now();
  addEventListener('pointermove',e=>{tmx=(e.clientX/innerWidth-.5);tmy=(e.clientY/innerHeight-.5);});
  function resize(){
    const dpr=Math.min(devicePixelRatio||1,1.5);
    cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
    gl.viewport(0,0,cv.width,cv.height);
  }
  resize();addEventListener('resize',resize);
  function loop(now){
    mx+=(tmx-mx)*.05;my+=(tmy-my)*.05;
    gl.uniform2f(uRes,cv.width,cv.height);
    gl.uniform1f(uT,(now-start)/1000);
    gl.uniform2f(uM,mx,my);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
(function(){const el=document.getElementById('clock');const p=n=>String(n).padStart(2,'0');
  setInterval(()=>{const d=new Date();el.textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} CST`;},1000);})();
</script>
