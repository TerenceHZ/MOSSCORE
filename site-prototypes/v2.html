<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>MOSS CORE · V2</title>
<style>
:root{--gold:#e8a020;--gold2:#ffc043;--green:#63C08E;--ink:#f2f0e8;--dim:#6b5f4a;
--mono:"JetBrains Mono",Consolas,monospace;--cjk:"Noto Sans SC","Microsoft YaHei",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030505;color:var(--ink);font-family:var(--cjk);overflow:hidden;height:100vh}
#galaxy{position:fixed;inset:0;z-index:1}
.grain{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.35;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>")}
.beam{position:fixed;z-index:2;pointer-events:none;height:1px;width:180%;left:-40%;
 background:linear-gradient(90deg,transparent,rgba(232,160,32,.55),rgba(255,255,255,.9),rgba(232,160,32,.55),transparent);
 filter:blur(.3px);opacity:.5;animation:beam 7s ease-in-out infinite}
.beam.a{top:26%;transform:rotate(-8deg)}
.beam.b{top:64%;transform:rotate(6deg);animation-delay:-3s;opacity:.35}
@keyframes beam{0%,100%{transform:translateY(0) rotate(var(--r,-8deg));opacity:.25}50%{transform:translateY(-24px) rotate(var(--r,-8deg));opacity:.7}}
.spot{position:fixed;z-index:3;width:900px;height:900px;left:0;top:0;pointer-events:none;transform:translate(-50%,-50%);
 background:radial-gradient(circle,rgba(232,160,32,.10),rgba(232,160,32,.03) 38%,transparent 62%);mix-blend-mode:screen}
.scan{position:fixed;inset:0;z-index:58;pointer-events:none;opacity:.5;
 background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.vig{position:fixed;inset:0;z-index:59;pointer-events:none;box-shadow:inset 0 0 300px 80px rgba(0,0,0,.95)}

.hud{position:fixed;z-index:50;inset:0;pointer-events:none;font:500 9.5px/1 var(--mono);letter-spacing:.24em;color:#5f5340}
.hud .tl{position:absolute;left:28px;top:24px;color:var(--ink);letter-spacing:.3em}
.hud .tl b{color:var(--gold)}
.hud .tr{position:absolute;right:28px;top:24px;color:var(--gold)}
.hud .bl{position:absolute;left:28px;bottom:24px}
.hud .br{position:absolute;right:28px;bottom:24px;text-align:right}
.hud .c{position:absolute;width:26px;height:26px;border:1px solid rgba(232,160,32,.55)}
.hud .c.tl{left:18px;top:16px;border-right:0;border-bottom:0}
.hud .c.tr{right:18px;top:16px;border-left:0;border-bottom:0}
.hud .c.bl{left:18px;bottom:16px;border-right:0;border-top:0}
.hud .c.br{right:18px;bottom:16px;border-left:0;border-top:0}

.stage{position:relative;z-index:10;height:100vh;display:grid;place-items:center;text-align:center}
.eyebrow{font:600 10px/1 var(--mono);letter-spacing:.62em;color:#8a7a5e;opacity:0;animation:fadeUp 1s .2s forwards}
h1{position:relative;margin-top:22px;font:800 clamp(64px,13vw,220px)/.86 var(--mono);letter-spacing:-.03em;user-select:none}
h1 .l{display:inline-block;will-change:transform;opacity:0;transform:translateY(60px) scale(.9);animation:pop .9s cubic-bezier(.19,1,.22,1) forwards}
h1 .l:nth-child(1){animation-delay:.35s}
h1 .l:nth-child(2){animation-delay:.42s}
h1 .l:nth-child(3){animation-delay:.49s}
h1 .l:nth-child(4){animation-delay:.56s}
h1 .l:nth-child(6){animation-delay:.68s}
h1 .l:nth-child(7){animation-delay:.75s}
h1 .l:nth-child(8){animation-delay:.82s}
h1 .l:nth-child(9){animation-delay:.89s}
h1 .gold{color:var(--gold);text-shadow:0 0 60px rgba(232,160,32,.55),0 0 160px rgba(232,160,32,.28)}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes fadeUp{to{opacity:1}}
h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;pointer-events:none;opacity:0}
h1::before{color:#63C08E;animation:gl 5s infinite steps(1)}
h1::after{color:#e8a020;animation:gl 6.7s infinite steps(1) reverse}
@keyframes gl{0%,90%,100%{opacity:0;transform:none}91%{opacity:.8;transform:translate(-6px,2px);clip-path:inset(10% 0 55% 0)}93%{opacity:0}95%{opacity:.6;transform:translate(5px,-2px);clip-path:inset(55% 0 12% 0)}97%{opacity:0}}

.tag{margin-top:26px;font:400 13px/2 var(--cjk);letter-spacing:.3em;color:#c0b195;opacity:0;animation:fadeUp 1s 1.1s forwards}
.tag b{color:var(--gold2)}
.cta{margin-top:40px;display:flex;gap:16px;opacity:0;animation:fadeUp 1s 1.35s forwards}
.btn{position:relative;padding:17px 34px;border:1px solid rgba(232,160,32,.55);overflow:hidden;
 font:600 11px/1 var(--mono);letter-spacing:.28em;color:var(--gold2);background:rgba(232,160,32,.06);transition:.3s;cursor:pointer}
.btn:hover{color:#fff;border-color:var(--gold);box-shadow:0 0 40px rgba(232,160,32,.35),inset 0 0 30px rgba(232,160,32,.15);transform:translateY(-2px)}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
 background:linear-gradient(100deg,transparent,rgba(255,230,170,.5),transparent);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%{left:-80%}55%,100%{left:140%}}
.btn.g{border-color:rgba(99,192,142,.55);color:#a9eccb;background:rgba(99,192,142,.06)}
.btn.g:hover{box-shadow:0 0 40px rgba(99,192,142,.3),inset 0 0 30px rgba(99,192,142,.12)}
h1 .l{animation:none!important;opacity:1!important;transform:none!important}
.eyebrow,.tag,.cta{animation:none!important;opacity:1!important}
</style></head>
<body>
<canvas id="galaxy"></canvas>
<div class="beam a" style="--r:-8deg"></div>
<div class="beam b" style="--r:6deg"></div>
<div class="spot" id="spot"></div>
<div class="scan"></div>
<div class="grain"></div>
<div class="vig"></div>

<div class="hud">
  <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
  <div class="tl">MOSS <b>CORE</b> // 550C</div>
  <div class="tr" id="clock">--:--:--</div>
  <div class="bl">UPLINK STABLE · 13 AGENTS · 8 UNITS</div>
  <div class="br">SYMBOLS 517<br>LATENCY &lt;200ms</div>
</div>

<div class="stage">
  <div>
    <div class="eyebrow">CONTRACT ANOMALY TERMINAL</div>
    <h1 data-t="MOSS CORE"><span class="l">M</span><span class="l">O</span><span class="l">S</span><span class="l">S</span><span class="l">&nbsp;</span><span class="l gold">C</span><span class="l gold">O</span><span class="l gold">R</span><span class="l gold">E</span></h1>
    <div class="tag">全平台合约异动监测 · <b>13 个智能体</b>在星环上接力研判</div>
    <div class="cta">
      <a class="btn" href="#">DOWNLOAD WINDOWS</a>
      <a class="btn g" href="#">macOS</a>
    </div>
  </div>
</div>

<script>
/* ================= 星系粒子 ================= */
(function(){
  const cv = document.getElementById('galaxy');
  const ctx = cv.getContext('2d');
  let W,H,DPR, stars=[], arms=[], t=0, mx=0, my=0, tmx=0, tmy=0;
  const ARMS = 4, PER_ARM = 620;

  function resize(){
    DPR = Math.min(devicePixelRatio||1, 2);
    W = cv.width = innerWidth*DPR; H = cv.height = innerHeight*DPR;
    cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
    stars = [];
    const n = Math.round(innerWidth*innerHeight/3800);
    for (let i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.1+.2)*DPR,a:Math.random()*.5+.1});
  }
  resize(); addEventListener('resize', resize);

  addEventListener('pointermove', e => {
    tmx = (e.clientX/innerWidth - .5);
    tmy = (e.clientY/innerHeight - .5);
    const sp = document.getElementById('spot');
    sp.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%,-50%)`;
  });

  function frame(ts){
    t += .006;
    mx += (tmx-mx)*.04; my += (tmy-my)*.04;
    ctx.clearRect(0,0,W,H);

    const cx = W/2, cy = H/2;
    const scale = Math.min(W,H) * 0.62;

    // 背景星
    for (const s of stars){
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283);
      ctx.fillStyle = `rgba(235,220,190,${(s.a*(0.6+0.4*Math.sin(ts/700+s.x))).toFixed(3)})`; ctx.fill();
    }

    // 旋臂粒子（伪 3D）
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.16);
    ctx.translate(-cx, -cy);
    ctx.globalCompositeOperation = 'lighter';
    for (let a=0;a<ARMS;a++){
      const off = (a/ARMS)*Math.PI*2;
      for (let i=0;i<PER_ARM;i++){
        const k = i/PER_ARM;
        const rad = 0.16 + k*0.86;
        const ang = off + k*3.1 + t + Math.sin(i*0.7+t*2)*0.02;
        const x3 = Math.cos(ang)*rad, z3 = Math.sin(ang)*rad;
        const y3 = Math.sin(k*9 + t*3)*0.03*(1-k*0.5);
        const persp = 1/(1.7 - z3*0.85);
        const sx = cx + (x3*persp + mx*0.12*persp)*scale;
        const sy = cy + (z3*0.42*persp + y3*persp + my*0.12*persp)*scale;
        const alpha = (0.05 + 0.5*Math.pow(k,0.7))*persp*0.9;
        const gold = (a%2===0);
        const size = (0.6 + persp*1.5)*DPR;
        ctx.beginPath(); ctx.arc(sx,sy,size,0,6.283);
        ctx.fillStyle = gold ? `rgba(232,160,32,${alpha.toFixed(3)})` : `rgba(120,220,180,${(alpha*0.8).toFixed(3)})`;
        ctx.fill();
      }
    }

    // 核心光晕
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,scale*0.5);
    g.addColorStop(0,'rgba(255,220,150,.55)');
    g.addColorStop(.25,'rgba(232,160,32,.18)');
    g.addColorStop(1,'rgba(232,160,32,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,scale*0.5,0,6.283); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    // 轨道环
    ctx.save(); ctx.translate(cx,cy);
    const rings = [[0.42,0.14,'rgba(232,160,32,.35)'],[0.62,0.10,'rgba(99,192,142,.28)'],[0.86,0.07,'rgba(232,160,32,.2)']];
    rings.forEach(([r,w,col],i)=>{
      ctx.beginPath();
      ctx.ellipse(0,0,scale*r,scale*r*0.42, Math.sin(t*0.3+i)*0.12 + i*0.3, 0, 6.283);
      ctx.strokeStyle = col; ctx.lineWidth = w*DPR; ctx.stroke();
    });
    // 环上光点
    for (let i=0;i<3;i++){
      const a = t*(1.2+i*0.35) + i*2.1;
      const r = scale*rings[i][0];
      const x = Math.cos(a)*r, y = Math.sin(a)*r*0.42;
      const gg = ctx.createRadialGradient(x,y,0,x,y,10*DPR);
      gg.addColorStop(0,'rgba(255,255,255,.95)'); gg.addColorStop(.4,'rgba(232,160,32,.7)'); gg.addColorStop(1,'rgba(232,160,32,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x,y,10*DPR,0,6.283); ctx.fill();
    }
    ctx.restore();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* 时钟 */
(function(){
  const el = document.getElementById('clock');
  setInterval(()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');
    el.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} CST`;},1000);
})();

/* 标题字母吸附鼠标 */
(function(){
  const letters = [...document.querySelectorAll('h1 .l')];
  addEventListener('pointermove', e => {
    letters.forEach((l,i) => {
      const r = l.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width/2);
      const dy = e.clientY - (r.top + r.height/2);
      const d = Math.hypot(dx,dy);
      const f = Math.max(0, 1 - d/420);
      l.style.transform = `translate(${(-dx*f*0.055).toFixed(2)}px, ${(-dy*f*0.055).toFixed(2)}px) scale(${1+f*0.06})`;
    });
  });
})();
</script>
</body></html>
