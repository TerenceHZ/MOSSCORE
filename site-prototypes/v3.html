h1 .row{display:block;overflow:hidden}
h1 .row span{display:inline-block;transform:translateY(110%);animation:rise 1s cubic-bezier(.19,1,.22,1) forwards}
h1 .row:nth-child(1) span{animation-delay:.15s}
h1 .row:nth-child(2) span{animation-delay:.33s}
@keyframes rise{to{transform:none}}
h1 .out{color:transparent;-webkit-text-stroke:1px rgba(232,160,32,.65)}
h1 .gold{color:var(--gold);text-shadow:0 0 80px rgba(232,160,32,.45)}
h1 .cursor{display:inline-block;width:.09em;height:.78em;background:var(--gold);margin-left:.06em;

@keyframes blink{50%{opacity:0}}

  font:600 11px/1 var(--mono);letter-spacing:.26em;color:var(--gold2);cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.btn:hover{background:rgba(232,160,32,.16);box-shadow:0 0 34px rgba(232,160,32,.3)}

.btn.g:hover{background:rgba(99,192,142,.14);box-shadow:0 0 34px rgba(99,192,142,.28)}
.side{position:fixed;right:3vw;top:50%;transform:translateY(-50%);z-index:20;text-align:right;

<script>
(function(){
  const cv=document.getElementById('rain'),ctx=cv.getContext('2d');
  let W,H,DPR,cols=[],font=16;
  const CH="01ABCDEF◇◆▚▞│─╱╲◢◣SIGNALPROOFOIRISKVOLUMEFUNDLIQCASTMOSSLSR".split("");
  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
    cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
    font=16*DPR;
    const n=Math.floor(W/font);
    cols=Array.from({length:n},(_,i)=>({y:Math.random()*H,sp:(Math.random()*1.4+.4)*DPR*font*0.06,a:Math.random()*.6+.2}));
  }
  resize();addEventListener('resize',resize);
  function frame(){
    ctx.fillStyle='rgba(2,4,4,.16)';ctx.fillRect(0,0,W,H);
    ctx.font=`600 ${font}px "JetBrains Mono",monospace`;
    for(let i=0;i<cols.length;i++){
      const c=cols[i];
      const ch=CH[(Math.random()*CH.length)|0];
      const x=i*font, y=c.y;
      const gold=(i%7===0);
      ctx.fillStyle=gold?`rgba(232,160,32,${c.a})`:`rgba(99,192,142,${c.a*0.55})`;
      ctx.fillText(ch,x,y);
      if(y>H+font && Math.random()>0.975) c.y=0;
      c.y+=c.sp*font*1.1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
